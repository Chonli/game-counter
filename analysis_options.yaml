include: package:flutter_lints/flutter.yaml
plugins:
  riverpod_lint:
    version: ^3.1.9
    diagnostics:
      missing_provider_scope: true
      provider_dependencies: true
      scoped_providers_should_specify_dependencies: true
      avoid_build_context_in_providers: true
      provider_parameters: true
      avoid_public_notifier_properties: true
      unsupported_provider_value: true
      functional_ref: true
      notifier_extends: true
      avoid_ref_inside_state_dispose: true
      avoid_keep_alive_dependency_inside_auto_dispose: true
      notifier_build: true
      riverpod_syntax_error: true
      async_value_nullable_pattern: true
      protected_notifier_properties: true

analyzer:
  exclude:
    - '**/lib/**/*.freezed.dart'
    - '**/lib/**/*.g.dart'
    - '**/l10n/localizations*.dart'
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    
linter:
  rules:
    cancel_subscriptions
    close_sinks
    avoid_bool_literals_in_conditional_expressions
    prefer_const_constructors
    prefer_const_declarations
    prefer_const_literals_to_create_immutables
    prefer_final_in_for_each
    prefer_final_locals
    prefer_null_aware_method_calls
    sized_box_shrink_expand
    throw_in_finally
    unnecessary_lambdas
    use_decorated_box
    use_colored_box
    use_null_aware_elements
    use_string_buffers

