name: Flutter Tests
description: Run Flutter Init and Tests

runs:
  using: 'composite'
  steps:
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.47.8'

    - name: Install dependencies
      shell: bash
      run: flutter pub get

    - name: Run Linter
      shell: bash
      run: |
        dart analyze

    - name: Run Unit Tests
      shell: bash
      run: flutter test
